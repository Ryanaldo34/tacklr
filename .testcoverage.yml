# Test coverage gates for Tacklr.
# Enforced in CI via go-test-coverage (https://github.com/vladopajic/go-test-coverage).
#
# Thresholds are outcome-oriented: high for pure logic packages, lower where the
# remaining lines are defensive SDK/exporter failure branches or cancel races
# that need live systems or brittle orchestration to force.

profile: coverage.out

threshold:
  file: 0
  # Root-package files (agent.go, tools_brain.go, …) are each a "package" to the
  # coverage tool. Floor 70% covers tools_brain/web without live backends.
  package: 70
  # Library total after excludes (cmd/, testkit, agentbench only).
  # Helixgraph is included: CI runs Testcontainers Helix (enterprise-dev) without -short.
  total: 90

# First matching override wins (specific packages first).
override:
  - path: github.com/ryanaldo34/tacklr/internal/mcp$
    threshold: 100
  - path: github.com/ryanaldo34/tacklr/skills$
    threshold: 100
  - path: github.com/ryanaldo34/tacklr/server$
    threshold: 95
  - path: github.com/ryanaldo34/tacklr/streaming$
    threshold: 100
  - path: github.com/ryanaldo34/tacklr/inference$
    threshold: 90
  - path: github.com/ryanaldo34/tacklr/internal/session$
    threshold: 90
  - path: github.com/ryanaldo34/tacklr/internal/exa$
    threshold: 90
  - path: github.com/ryanaldo34/tacklr/interrupt$
    threshold: 90
  - path: github.com/ryanaldo34/tacklr/stores$
    threshold: 90
  - path: github.com/ryanaldo34/tacklr/brain$
    threshold: 85
  # Live Testcontainers Helix (CI pulls enterprise-dev; never -short in CI).
  - path: github.com/ryanaldo34/tacklr/brain/helixgraph$
    threshold: 90
  - path: github.com/ryanaldo34/tacklr/telemetry$
    threshold: 90
  # VFS/S3 unit surface + fake API; integration (MinIO) is separate.
  - path: github.com/ryanaldo34/tacklr/vfs$
    threshold: 85
  - path: github.com/ryanaldo34/tacklr/vfsindex$
    threshold: 80

exclude:
  # Repo-relative paths (matched as regexes against file paths).
  # cmd/*: mains / local harnesses. testkit: test doubles. agentbench: live
  # multi-turn bench (exercised by agent-bench, not unit cover).
  paths:
    - cmd/
    - internal/testkit
    - internal/agentbench
    - internal/temporallive
    # Exporter constructors, not product outcomes.
    - telemetry/otel.go

breakdown-file-name: coverage.breakdown

diff:
  base-breakdown-file-name: ""
  threshold: null
