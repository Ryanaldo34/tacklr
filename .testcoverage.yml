# Test coverage gates for Tacklr.
# Enforced in CI via go-test-coverage (https://github.com/vladopajic/go-test-coverage).
#
# Every package must be fully covered, except the ones listed under override,
# each held at its coverage today: a change may raise a floor, never lower it.
# What is uncovered there is a race, a host-only path, or an error the
# platform cannot produce on demand (see the package's tests).

profile: coverage.out

threshold:
  file: 0
  # Package paths are relative to the module. Each root-package file is its
  # own "package" to the tool (agent_construct.go, tools.go, ...).
  package: 100
  # Library total after the excludes below.
  total: 99

# Floors below 100, first match wins. Paths are module-relative regexes.
override:
  - path: ^agent_construct\.go$
    threshold: 98
  - path: ^model_tasks\.go$
    threshold: 99
  - path: ^toolcall\.go$
    threshold: 97
  - path: ^tools\.go$
    threshold: 99
  - path: ^brain$
    threshold: 99
  - path: ^brain/helixgraph$
    threshold: 99
  - path: ^openai$
    threshold: 99
  - path: ^server/acp$
    threshold: 99
  - path: ^session/durableobject$
    threshold: 96
  - path: ^session/durableobject/dotest$
    threshold: 94
  - path: ^session/internal$
    threshold: 98
  - path: ^session/orchestrator$
    threshold: 98
  - path: ^session/postgres$
    threshold: 99
  - path: ^session/temporal$
    threshold: 93
  - path: ^session/temporal/worker$
    threshold: 97
  - path: ^shell$
    threshold: 95
  - path: ^vfs$
    threshold: 99
  - path: ^vfs/fuse$
    threshold: 97
  - path: ^vfsindex$
    threshold: 99
  - path: ^telemetry/export$
    threshold: 99

# A pull request may not lower total coverage below main's last good run
# (its breakdown is downloaded in CI). The small allowance absorbs the few
# race-only statements that a run may or may not reach.
diff:
  threshold: -0.1

exclude:
  # Repo-relative paths (matched as regexes against file paths).
  # cmd/*: mains / local harnesses. testkit/livesess: test doubles.
  paths:
    - cmd/
    - internal/testkit
    - internal/testdrive
    - internal/testhttp
    - internal/livesess
    - internal/acptest
    # Store isolation contract, run from each store's tests.
    - brain/storetest
    - session/storetest
    - vfs/internal/vfstest
    - brain/graphtest
    # In-process git host (HTTP + SSH) for vfs.Git tests.
    - internal/testgit
    # Docker bootstrap for live Temporal tests. Failure branches are the
    # container runtime, not a product outcome.
    - internal/temporaldocker
    - internal/helixtest
    - internal/pgtest
    - internal/faultproxy
    - internal/s3test

breakdown-file-name: coverage.breakdown
